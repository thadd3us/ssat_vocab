# Publishing a GitHub release builds the single-file app, attaches it to the release as
# word-bank.html, and puts it on GitHub Pages as index.html. "Run workflow" on the Actions
# tab redeploys Pages from the chosen branch without making a release.
#
#   gh release create v1.0 --generate-notes
#
# One-time setup: Settings → Pages → Source: "GitHub Actions".
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write # attach the file to the release
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Test
        run: node --test "tests/*.test.js"
      - name: Build the single file
        run: node scripts/build_single_file.mjs --out site/index.html
      - name: Attach it to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cp site/index.html word-bank.html
          gh release upload "$TAG" word-bank.html --clobber
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
